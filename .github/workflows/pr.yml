# Pull request validation (TICKET-001).
# Validates Terraform and builds frontend/backend. Never applies infrastructure.
# Steps for terraform/, frontend/ and backend/ are skipped until those directories exist.
name: PR Validation

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AWS_REGION: eu-central-1
  TF_VERSION: 1.16.4
  TF_DIR: terraform
  NODE_VERSION: "22"

jobs:
  terraform:
    name: Terraform Validate & Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for GitHub OIDC
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        if: hashFiles('terraform/**/*.tf') != ''
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false # keep `terraform show -json` output clean

      # Offline checks first: they give feedback even if AWS authentication fails.
      - name: Terraform fmt check
        if: hashFiles('terraform/**/*.tf') != ''
        run: terraform -chdir="$TF_DIR" fmt -check -recursive

      - name: Terraform init (without backend)
        if: hashFiles('terraform/**/*.tf') != ''
        run: terraform -chdir="$TF_DIR" init -input=false -backend=false

      - name: Terraform validate
        if: hashFiles('terraform/**/*.tf') != ''
        run: terraform -chdir="$TF_DIR" validate

      - name: Terraform test (mocked provider, no AWS access)
        if: hashFiles('terraform/**/*.tf') != ''
        run: terraform -chdir="$TF_DIR" test

      - name: Tag checker unit tests
        if: hashFiles('terraform/**/*.tf') != ''
        run: python3 -m unittest discover -s scripts/tests

      # TEMPORARY (TICKET-001 OIDC troubleshooting): prints only non-secret OIDC claims and
      # the role name (no account ID, never the token). Remove once the trust policy works.
      - name: Debug OIDC claims (temporary)
        continue-on-error: true
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          echo "$token" | python3 -c '
          import base64, json, sys
          payload = sys.stdin.read().strip().split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          for key in ("sub", "aud", "iss", "repository", "repository_owner", "event_name", "ref", "job_workflow_ref"):
              print(f"{key}: {claims.get(key)}")
          '
          python3 - <<'PY'
          import os, re
          arn = os.environ.get("ROLE_ARN", "")
          match = re.fullmatch(r"arn:aws:iam::\d{12}:role/(.+)", arn.strip())
          print("AWS_ROLE_ARN well-formed:", bool(match))
          print("AWS_ROLE_ARN has surrounding whitespace:", arn != arn.strip())
          if match:
              print("Role name:", match.group(1))
          PY

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: tenner-pr-${{ github.run_id }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Terraform init
        if: hashFiles('terraform/**/*.tf') != ''
        run: terraform -chdir="$TF_DIR" init -input=false

      - name: Setup Node.js (Lambda bundle)
        if: hashFiles('terraform/**/*.tf') != '' && hashFiles('backend/package.json') != ''
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build Lambda bundle
        if: hashFiles('terraform/**/*.tf') != '' && hashFiles('backend/package.json') != ''
        working-directory: backend
        run: |
          npm ci
          npm run build

      - name: Terraform plan
        if: hashFiles('terraform/**/*.tf') != ''
        run: terraform -chdir="$TF_DIR" plan -input=false -lock-timeout=5m -out=tfplan

      - name: Enforce mandatory tags
        if: hashFiles('terraform/**/*.tf') != ''
        run: |
          terraform -chdir="$TF_DIR" show -json tfplan > plan.json
          python3 scripts/check_tags.py plan.json

      - name: Report skipped Terraform steps
        if: hashFiles('terraform/**/*.tf') == ''
        run: echo "::notice::No Terraform configuration in $TF_DIR/ yet - Terraform steps skipped."

  build:
    name: Build ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [frontend, backend]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Report skipped build
        if: hashFiles(format('{0}/package.json', matrix.project)) == ''
        working-directory: .
        run: echo "::notice::No ${{ matrix.project }}/package.json yet - build skipped."

      - name: Setup Node.js
        if: hashFiles(format('{0}/package.json', matrix.project)) != ''
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        if: hashFiles(format('{0}/package.json', matrix.project)) != ''
        run: npm ci

      - name: Lint
        if: hashFiles(format('{0}/package.json', matrix.project)) != ''
        run: npm run lint --if-present

      - name: Test
        if: hashFiles(format('{0}/package.json', matrix.project)) != ''
        run: npm test --if-present

      - name: Build
        if: hashFiles(format('{0}/package.json', matrix.project)) != ''
        run: npm run build
