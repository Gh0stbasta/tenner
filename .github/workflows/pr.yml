# Pull request validation (TICKET-001).
# Validates Terraform and builds frontend/backend. Never applies infrastructure.
# Steps for terraform/, frontend/ and backend/ are skipped until those directories exist.
name: PR Validation

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AWS_REGION: eu-central-1
  TF_VERSION: 1.16.4
  TF_DIR: terraform
  NODE_VERSION: "22"

jobs:
  terraform:
    name: Terraform Validate & Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for GitHub OIDC
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        if: hashFiles('terraform/**/*.tf') != ''
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false # keep `terraform show -json` output clean

      # Offline checks first: they give feedback even if AWS authentication fails.
      - name: Terraform fmt check
        if: hashFiles('terraform/**/*.tf') != ''
        run: terraform -chdir="$TF_DIR" fmt -check -recursive

      - name: Terraform init (without backend)
        if: hashFiles('terraform/**/*.tf') != ''
        run: terraform -chdir="$TF_DIR" init -input=false -backend=false

      - name: Terraform validate
        if: hashFiles('terraform/**/*.tf') != ''
        run: terraform -chdir="$TF_DIR" validate

      - name: Terraform test (mocked provider, no AWS access)
        if: hashFiles('terraform/**/*.tf') != ''
        run: terraform -chdir="$TF_DIR" test

      - name: Script unit tests (tag and npm audit checkers)
        if: hashFiles('terraform/**/*.tf') != ''
        run: python3 -m unittest discover -s scripts/tests

      # HOTFIX-002: Dependabot runs get no repository secrets (and must not get the deploy role, TD-008),
      # so the AWS-dependent steps below are skipped for its pull requests.
      - name: Report skipped AWS plan for Dependabot
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        run: echo "::notice::Dependabot pull request - Terraform plan skipped (no AWS access). The deploy workflow plans after the merge."

      - name: Configure AWS credentials (OIDC)
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: tenner-pr-${{ github.run_id }}

      - name: Verify AWS identity
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        run: aws sts get-caller-identity

      - name: Terraform init
        if: github.event.pull_request.user.login != 'dependabot[bot]' && hashFiles('terraform/**/*.tf') != ''
        run: terraform -chdir="$TF_DIR" init -input=false

      - name: Setup Node.js (Lambda bundle)
        if: github.event.pull_request.user.login != 'dependabot[bot]' && hashFiles('terraform/**/*.tf') != '' && hashFiles('backend/package.json') != ''
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build Lambda bundle
        if: github.event.pull_request.user.login != 'dependabot[bot]' && hashFiles('terraform/**/*.tf') != '' && hashFiles('backend/package.json') != ''
        working-directory: backend
        run: |
          npm ci
          npm run build

      # ALEXA-001: the skill Lambda bundle is only needed once the skill exists (GitHub variable ALEXA_SKILL_ID).
      - name: Build Alexa skill bundle
        if: github.event.pull_request.user.login != 'dependabot[bot]' && hashFiles('terraform/**/*.tf') != '' && vars.ALEXA_SKILL_ID != ''
        working-directory: alexa
        run: |
          npm ci
          npm run build

      - name: Terraform plan
        if: github.event.pull_request.user.login != 'dependabot[bot]' && hashFiles('terraform/**/*.tf') != ''
        env:
          # Google sign-in (FUTURE-011). The ID is not secret; the secret is masked in logs and stays on the
          # runner (plan file and plan.json are never uploaded).
          TF_VAR_google_client_id: ${{ vars.GOOGLE_CLIENT_ID }}
          TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          # Cost alerts (OPERATIONS-001): e-mail is a secret (personal data); the monitor ARN is optional.
          TF_VAR_budget_alert_email: ${{ secrets.BUDGET_ALERT_EMAIL }}
          TF_VAR_cost_anomaly_monitor_arn: ${{ vars.COST_ANOMALY_MONITOR_ARN }}
          # Alexa skill (ALEXA-001): the skill ID is not secret; empty means no Alexa resources.
          TF_VAR_alexa_skill_id: ${{ vars.ALEXA_SKILL_ID }}
          # Alexa account linking (ALEXA-002): JSON list of the console's redirect URLs; empty means no Alexa client.
          TF_VAR_alexa_redirect_urls: ${{ vars.ALEXA_REDIRECT_URLS || '[]' }}
          # Notifier (NOTIFICATION-001): off until the deploy role has the notifier permissions.
          TF_VAR_notifications_enabled: ${{ vars.NOTIFICATIONS_ENABLED || 'false' }}
          # Monitoring (OBSERVABILITY-001/002): off until the deploy role has the CloudWatch/SNS permissions.
          TF_VAR_observability_enabled: ${{ vars.OBSERVABILITY_ENABLED || 'false' }}
          # NOTIFICATION-009: VAPID public key (not secret); empty = browser push disabled.
          TF_VAR_web_push_public_key: ${{ vars.WEB_PUSH_PUBLIC_KEY }}
        run: terraform -chdir="$TF_DIR" plan -input=false -lock-timeout=5m -out=tfplan

      - name: Enforce mandatory tags
        if: github.event.pull_request.user.login != 'dependabot[bot]' && hashFiles('terraform/**/*.tf') != ''
        run: |
          terraform -chdir="$TF_DIR" show -json tfplan > plan.json
          python3 scripts/check_tags.py plan.json

      - name: Report skipped Terraform steps
        if: hashFiles('terraform/**/*.tf') == ''
        run: echo "::notice::No Terraform configuration in $TF_DIR/ yet - Terraform steps skipped."

  build:
    name: Build ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [frontend, backend, alexa]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Report skipped build
        if: hashFiles(format('{0}/package.json', matrix.project)) == ''
        working-directory: .
        run: echo "::notice::No ${{ matrix.project }}/package.json yet - build skipped."

      - name: Setup Node.js
        if: hashFiles(format('{0}/package.json', matrix.project)) != ''
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        if: hashFiles(format('{0}/package.json', matrix.project)) != ''
        run: npm ci

      # SECURITY-007: high/critical vulnerabilities in production dependencies fail the build,
      # unless a time-boxed exception exists in .github/npm-audit-allowlist.json.
      - name: Audit production dependencies
        if: hashFiles(format('{0}/package.json', matrix.project)) != ''
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/audit.json" || true
          python3 ../scripts/check_npm_audit.py "$RUNNER_TEMP/audit.json" ../.github/npm-audit-allowlist.json

      - name: Lint
        if: hashFiles(format('{0}/package.json', matrix.project)) != ''
        run: npm run lint --if-present

      - name: Test
        if: hashFiles(format('{0}/package.json', matrix.project)) != ''
        run: npm test --if-present

      - name: Build
        if: hashFiles(format('{0}/package.json', matrix.project)) != ''
        run: npm run build
