# Main branch deployment (TICKET-001, TICKET-018).
# Builds frontend/backend/alexa as a gate, applies Terraform using GitHub OIDC, verifies /health,
# then builds the frontend against the deployed API and publishes it to S3/CloudFront.
# Steps for terraform/, frontend/ and backend/ are skipped until those directories exist.
name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false # never interrupt a running terraform apply

env:
  AWS_REGION: eu-central-1
  TF_VERSION: 1.16.4
  TF_DIR: terraform
  NODE_VERSION: "22"

jobs:
  build:
    name: Build ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [frontend, backend, alexa]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Report skipped build
        if: hashFiles(format('{0}/package.json', matrix.project)) == ''
        working-directory: .
        run: echo "::notice::No ${{ matrix.project }}/package.json yet - build skipped."

      - name: Setup Node.js
        if: hashFiles(format('{0}/package.json', matrix.project)) != ''
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        if: hashFiles(format('{0}/package.json', matrix.project)) != ''
        run: npm ci

      # SECURITY-007: high/critical vulnerabilities in production dependencies fail the build,
      # unless a time-boxed exception exists in .github/npm-audit-allowlist.json.
      - name: Audit production dependencies
        if: hashFiles(format('{0}/package.json', matrix.project)) != ''
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/audit.json" || true
          python3 ../scripts/check_npm_audit.py "$RUNNER_TEMP/audit.json" ../.github/npm-audit-allowlist.json

      - name: Build
        if: hashFiles(format('{0}/package.json', matrix.project)) != ''
        run: npm run build

  terraform:
    name: Terraform Apply
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for GitHub OIDC
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: tenner-deploy-${{ github.run_id }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        if: hashFiles('terraform/**/*.tf') != ''
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false # keep `terraform show -json` output clean

      - name: Terraform init
        if: hashFiles('terraform/**/*.tf') != ''
        run: terraform -chdir="$TF_DIR" init -input=false

      - name: Setup Node.js (Lambda bundle)
        if: hashFiles('terraform/**/*.tf') != '' && hashFiles('backend/package.json') != ''
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build Lambda bundle
        if: hashFiles('terraform/**/*.tf') != '' && hashFiles('backend/package.json') != ''
        working-directory: backend
        run: |
          npm ci
          npm run build

      # ALEXA-001: the skill Lambda bundle is only needed once the skill exists (GitHub variable ALEXA_SKILL_ID).
      - name: Build Alexa skill bundle
        if: hashFiles('terraform/**/*.tf') != '' && vars.ALEXA_SKILL_ID != ''
        working-directory: alexa
        run: |
          npm ci
          npm run build

      - name: Terraform plan
        if: hashFiles('terraform/**/*.tf') != ''
        env:
          # Google sign-in (FUTURE-011). The ID is not secret; the secret is masked in logs and stays on the
          # runner (plan file and plan.json are never uploaded).
          TF_VAR_google_client_id: ${{ vars.GOOGLE_CLIENT_ID }}
          TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          # Cost alerts (OPERATIONS-001): e-mail is a secret (personal data); the monitor ARN is optional.
          TF_VAR_budget_alert_email: ${{ secrets.BUDGET_ALERT_EMAIL }}
          TF_VAR_cost_anomaly_monitor_arn: ${{ vars.COST_ANOMALY_MONITOR_ARN }}
          # Alexa skill (ALEXA-001): the skill ID is not secret; empty means no Alexa resources.
          TF_VAR_alexa_skill_id: ${{ vars.ALEXA_SKILL_ID }}
          # Alexa account linking (ALEXA-002): JSON list of the console's redirect URLs; empty means no Alexa client.
          TF_VAR_alexa_redirect_urls: ${{ vars.ALEXA_REDIRECT_URLS || '[]' }}
        run: terraform -chdir="$TF_DIR" plan -input=false -lock-timeout=5m -out=tfplan

      - name: Enforce mandatory tags
        if: hashFiles('terraform/**/*.tf') != ''
        run: |
          terraform -chdir="$TF_DIR" show -json tfplan > plan.json
          python3 scripts/check_tags.py plan.json

      - name: Terraform apply
        if: hashFiles('terraform/**/*.tf') != ''
        run: terraform -chdir="$TF_DIR" apply -input=false -lock-timeout=5m tfplan

      - name: Verify health endpoint
        if: hashFiles('terraform/**/*.tf') != ''
        run: |
          endpoint="$(terraform -chdir="$TF_DIR" output -raw api_endpoint 2>/dev/null || true)"
          if [ -z "$endpoint" ]; then
            echo "::notice::No api_endpoint output - health check skipped."
            exit 0
          fi
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "${endpoint%/}/health"

      # Frontend deployment (TICKET-018): build against the deployed API, then publish.
      - name: Setup Node.js (frontend)
        if: hashFiles('terraform/**/*.tf') != '' && hashFiles('frontend/package.json') != ''
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build frontend for this environment
        if: hashFiles('terraform/**/*.tf') != '' && hashFiles('frontend/package.json') != ''
        run: |
          VITE_API_BASE_URL="$(terraform -chdir="$TF_DIR" output -raw api_endpoint)"
          VITE_COGNITO_ISSUER_URL="$(terraform -chdir="$TF_DIR" output -raw cognito_issuer_url)"
          VITE_COGNITO_CLIENT_ID="$(terraform -chdir="$TF_DIR" output -raw cognito_client_id)"
          VITE_COGNITO_LOGIN_URL="$(terraform -chdir="$TF_DIR" output -raw cognito_login_url)"
          export VITE_API_BASE_URL VITE_COGNITO_ISSUER_URL VITE_COGNITO_CLIENT_ID VITE_COGNITO_LOGIN_URL
          npm ci --prefix frontend
          npm run build --prefix frontend

      - name: Publish frontend to S3 and invalidate CloudFront
        if: hashFiles('terraform/**/*.tf') != '' && hashFiles('frontend/package.json') != ''
        run: |
          scripts/deploy-frontend.sh frontend/dist \
            "$(terraform -chdir="$TF_DIR" output -raw frontend_bucket_name)" \
            "$(terraform -chdir="$TF_DIR" output -raw cloudfront_distribution_id)"

      # OPERATIONS-006: read-only checks of the live system; a failure fails the deployment run.
      - name: Smoke tests
        if: hashFiles('terraform/**/*.tf') != '' && hashFiles('frontend/package.json') != ''
        run: |
          scripts/smoke-test.sh \
            "$(terraform -chdir="$TF_DIR" output -raw frontend_url)" \
            "$(terraform -chdir="$TF_DIR" output -raw api_endpoint)"

      # ALEXA-001: manifest + interaction model to the development stage via SMAPI (after apply, so the
      # endpoint Lambda and its permission exist). Skipped until the skill exists (GitHub variable ALEXA_SKILL_ID).
      - name: Deploy Alexa skill package
        if: hashFiles('terraform/**/*.tf') != '' && vars.ALEXA_SKILL_ID != ''
        env:
          ASK_REFRESH_TOKEN: ${{ secrets.ASK_REFRESH_TOKEN }}
          ASK_VENDOR_ID: ${{ secrets.ASK_VENDOR_ID }}
          ALEXA_SKILL_ID: ${{ vars.ALEXA_SKILL_ID }}
        run: |
          scripts/deploy-alexa-skill.sh alexa/skill-package "$ALEXA_SKILL_ID" \
            "$(terraform -chdir="$TF_DIR" output -raw alexa_skill_lambda_arn)"

      - name: Report skipped Alexa skill deployment
        if: vars.ALEXA_SKILL_ID == ''
        run: echo "::notice::GitHub variable ALEXA_SKILL_ID not set - Alexa skill deployment skipped (see alexa/README.md)."

      - name: Report skipped frontend deployment
        if: hashFiles('frontend/package.json') == ''
        run: echo "::notice::No frontend/package.json yet - frontend deployment skipped."

      - name: Report skipped Terraform steps
        if: hashFiles('terraform/**/*.tf') == ''
        run: echo "::notice::No Terraform configuration in $TF_DIR/ yet - Terraform steps skipped."
